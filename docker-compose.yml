version: '3.9'

services:
  # ── PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: motogest_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       motogest
      POSTGRES_USER:     motogest
      POSTGRES_PASSWORD: motogest_senha
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./motogest-backend/sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motogest"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ──────────────────────────────────────────────
  backend:
    build:
      context: ./motogest-backend
      dockerfile: Dockerfile
    container_name: motogest_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV:      production
      PORT:          3001
      DATABASE_URL:  postgresql://motogest:motogest_senha@postgres:5432/motogest
      JWT_SECRET:    troque_por_chave_aleatoria_muito_longa_aqui_64chars_min
      CORS_ORIGINS:  http://localhost:3000
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Frontend Next.js ─────────────────────────────────────────
  frontend:
    build:
      context: ./motogest-frontend
      dockerfile: Dockerfile
    container_name: motogest_web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"

volumes:
  postgres_data:
